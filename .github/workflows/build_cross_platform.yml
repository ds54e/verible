name: Build Verible (RHEL8 & Windows)

on:
  push:
    branches: [ "my-custom-verible" ]
  workflow_dispatch:

jobs:
  # ==================================================
  # Job 1: RHEL8用ビルド (Fix: バージョン6.5.0強制)
  # ==================================================
  build-rhel8:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Build in RHEL8 Container
      run: |
        # ポイント: export USE_BAZEL_VERSION=6.5.0 をコンテナ内のコマンド先頭で実行
        docker run --rm -v ${{ github.workspace }}:/work -w /work rockylinux:8 /bin/bash -c "
          
          # 1. バージョン固定 (ここが最重要)
          export USE_BAZEL_VERSION=6.5.0 &&
          
          # 2. ツール類インストール
          dnf install -y git gcc gcc-c++ python3 tar unzip which &&
          
          # 3. Bazelisk取得 (Linux用)
          curl -L https://github.com/bazelbuild/bazelisk/releases/download/v1.18.0/bazelisk-linux-amd64 -o /usr/bin/bazel &&
          chmod +x /usr/bin/bazel &&
          
          # 4. ビルド実行
          # バージョン6.5.0であれば、古いWORKSPACE定義でも正しく動作します
          bazel build \
            --jobs=2 \
            --compilation_mode=opt \
            --linkopt=-static-libstdc++ \
            --linkopt=-static-libgcc \
            //verilog/tools/lint:verible-verilog-lint
        "

    - name: Rename Artifact
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        # コンテナ内で生成されたバイナリをリネーム
        cp bazel-bin/verilog/tools/lint/verible-verilog-lint ./verible-lint-rhel8-${SHORT_SHA}

    - uses: actions/upload-artifact@v4
      with:
        name: verible-lint-rhel8
        path: ./verible-lint-rhel8-*

  # ==================================================
  # Job 2: Windows用ビルド (Fix: バージョン6.5.0強制 & 手動セットアップ)
  # ==================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    # アクションを使わず、手動でダウンロードしてPATHに通す (Cacheエラー回避)
    - name: Setup Bazelisk Manually
      shell: bash
      run: |
        mkdir -p $HOME/bin
        curl -L https://github.com/bazelbuild/bazelisk/releases/download/v1.18.0/bazelisk-windows-amd64.exe -o $HOME/bin/bazel.exe
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Build Verible Lint (Windows)
      shell: bash
      # 【重要】Windows側も環境変数でバージョンを固定
      env:
        USE_BAZEL_VERSION: 6.5.0
      run: |
        bazel build \
          --jobs=2 \
          --compilation_mode=opt \
          //verilog/tools/lint:verible-verilog-lint

    - name: Rename Artifact
      shell: bash
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        cp bazel-bin/verilog/tools/lint/verible-verilog-lint.exe ./verible-lint-windows-${SHORT_SHA}.exe

    - uses: actions/upload-artifact@v4
      with:
        name: verible-lint-windows
        path: ./verible-lint-windows-*.exe
